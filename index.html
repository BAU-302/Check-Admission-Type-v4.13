<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입시 전형 체크</title>

  <!-- iOS Safari 및 Android 홈 화면 아이콘 설정 -->
  <link rel="apple-touch-icon" href="https://bau-302.github.io/Check-Admission-Type-v4.13/icon-192.jpg">
  <link rel="apple-touch-icon-precomposed" href="https://bau-302.github.io/Check-Admission-Type-v4.13/icon-192.jpg">
  <link rel="icon" type="image/jpeg" href="https://bau-302.github.io/Check-Admission-Type-v4.13/icon-192.jpg">

  <!-- iOS Web App 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="입시 전형 체크">
  <meta name="theme-color" content="#0b63d8">

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/a/macros/bau.ac.kr/s/AKfycbxwfQ8CFtCFVIGfR826H9luW6pCjaNCfOAZft9_BYBCRezo8sA-00DgJ3456HZ1RDAGug/exec";

    // Safari가 아이콘 태그를 읽을 시간을 확보하기 위해 0.3초 후 이동
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        window.location.href = GAS_WEB_APP_URL;
      }, 300);
    });
  </script>
</head>
<body>
  <div style="text-align: center; margin-top: 100px; font-family: -apple-system, sans-serif; color: #555;">
    <p style="font-size: 18px; font-weight: bold;">입시 전형 체크</p>
    <p style="font-size: 14px; color: #888;">페이지로 이동 중입니다...</p>
  </div>
</body>
</html>
