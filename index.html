<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입시 전형 체크</title>

  <!-- iOS Safari 아이콘 지정 -->
  <link rel="apple-touch-icon" href="https://bau-302.github.io/Check-Admission-Type-v4.13/icon-180.png">
  <link rel="apple-touch-icon-precomposed" href="https://bau-302.github.io/Check-Admission-Type-v4.13/icon-180.png">
  <link rel="icon" type="image/jpeg" href="https://bau-302.github.io/Check-Admission-Type-v4.13/icon-192.png">

  <!-- 홈 화면 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="입시 전형 체크">
  <meta name="theme-color" content="#0b63d8">

  <script>
    // ⚠️ 여기에 실제 구글 웹앱 배포 URL을 넣어주세요.
    const GAS_URL = "https://script.google.com/a/macros/bau.ac.kr/s/AKfycbxwfQ8CFtCFVIGfR826H9luW6pCjaNCfOAZft9_BYBCRezo8sA-00DgJ3456HZ1RDAGug/exec
";

    // 1. 홈 화면 아이콘을 눌러 앱(PWA) 형태로 실행한 경우 자동 이동
    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
      if (GAS_URL && GAS_URL !== "https://script.google.com/a/macros/bau.ac.kr/s/AKfycbxwfQ8CFtCFVIGfR826H9luW6pCjaNCfOAZft9_BYBCRezo8sA-00DgJ3456HZ1RDAGug/exec
") {
        window.location.href = GAS_URL;
      }
    }

    // 2. 페이지 로드 완료 시 a 태그에 링크 주소 할당
    window.addEventListener("DOMContentLoaded", () => {
      const linkBtn = document.getElementById("app-link");
      if (linkBtn && GAS_URL) {
        linkBtn.href = GAS_URL;
      }
    });
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    .icon-img {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 32px;
      background-color: #0b63d8;
      color: white !important;
      text-decoration: none !important;
      font-weight: bold;
      border-radius: 12px;
      font-size: 17px;
      box-shadow: 0 4px 12px rgba(11, 99, 216, 0.3);
      -webkit-tap-highlight-color: transparent;
    }
    .guide-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>
<body>

  <img src="https://bau-302.github.io/Check-Admission-Type-v4.13/icon-192.jpg" class="icon-img" alt="앱 아이콘">
  <h2 style="margin: 0 0 10px 0;">입시 전형 체크</h2>
  <p style="margin: 0; color: #666;">홈 화면에 추가하여 앱처럼 편리하게 이용하세요.</p>

  <div class="guide-box">
    <strong>📱 홈 화면에 추가하는 방법:</strong><br>
    1. Safari 하단 중앙의 <strong>공유 버튼 (네모+화살표)</strong>을 누릅니다.<br>
    2. 메뉴를 아래로 내려 <strong>'홈 화면에 추가'</strong>를 선택합니다.<br>
    3. 우측 상단 <strong>'추가'</strong>를 누르면 바로 생성됩니다.
  </div>

  <!-- 자바스크립트 없이도 동작하는 직접 링크 버튼 -->
  <a id="app-link" href="#" class="btn">
    웹에서 바로 시작하기 ➔
  </a>

</body>
</html>
